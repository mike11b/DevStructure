<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEVSTRUCTURE — Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D0A1A;
      --bg2:       #120D24;
      --bg3:       #160F2A;
      --bg4:       #1C1335;
      --border:    #2A1F45;
      --border2:   #3D2D60;
      --text:      #F0EEFF;
      --text2:     #C4B8E8;
      --muted:     #9B8FBF;
      --muted2:    #6B5F8F;
      --cyan:      #00C8F0;
      --magenta:   #FF2D78;
      --amber:     #F59E0B;

      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 0;
    }

    /* ── GRID BG ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,240,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,240,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAVBAR ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 60px;
      background: rgba(13,10,26,0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .nav-logo-text {
      font-family: var(--font-body);
      font-size: 17px; font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--cyan);
    }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a {
      color: var(--muted); font-size: 14px; text-decoration: none;
      font-family: var(--font-body); font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      background: transparent;
      border: 1px solid rgba(0,200,240,0.45);
      color: var(--cyan);
      font-family: var(--font-body);
      font-size: 13px; font-weight: 700;
      padding: 7px 18px; border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-cta:hover { background: rgba(0,200,240,0.10); }

    /* ── HERO ── */
    .hero {
      position: relative; z-index: 1;
      text-align: center;
      padding: 80px 24px 56px;
    }
    .hero-tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--bg2); border: 1px solid rgba(0,200,240,0.25);
      border-radius: 6px; padding: 6px 14px; margin-bottom: 24px;
    }
    .hero-tag .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--magenta); box-shadow: 0 0 10px var(--magenta);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--magenta); }
      50%       { opacity: 0.5; box-shadow: 0 0 4px var(--magenta); }
    }
    .hero-tag span {
      color: var(--cyan); font-family: var(--font-mono);
      font-size: 12px; letter-spacing: 0.1em;
    }
    .hero h1 {
      font-family: var(--font-body);
      font-size: clamp(40px, 6vw, 68px);
      font-weight: 800; line-height: 1.08;
      letter-spacing: -0.03em; color: var(--text);
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(90deg, var(--cyan) 0%, var(--magenta) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: var(--muted); font-size: 17px; margin-top: 20px;
      max-width: 480px; margin-left: auto; margin-right: auto;
      line-height: 1.65; font-weight: 400;
    }

    /* ── FILTERS ── */
    .filters {
      position: relative; z-index: 1;
      display: flex; gap: 8px; justify-content: center;
      flex-wrap: wrap; padding: 0 24px 40px;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 13px; font-weight: 600;
      padding: 8px 18px; border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: rgba(0,200,240,0.35); color: var(--text); }
    .filter-btn.active {
      background: rgba(0,200,240,0.10);
      border-color: rgba(0,200,240,0.45);
      color: var(--cyan);
    }

    /* ── GRID ── */
    .grid {
      position: relative; z-index: 1;
      display: flex; flex-wrap: wrap; gap: 24px;
      justify-content: center;
      padding: 0 24px 80px;
      max-width: 1200px; margin: 0 auto;
    }

    /* ── CARD ── */
    .card {
      width: 340px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1),
                  box-shadow 0.3s cubic-bezier(.4,0,.2,1),
                  border-color 0.3s;
      animation: fadeUp 0.5s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.12s; }
    .card:nth-child(3) { animation-delay: 0.19s; }
    .card:nth-child(4) { animation-delay: 0.26s; }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-topbar {
      height: 3px;
      transition: opacity 0.3s;
      opacity: 0.6;
    }
    .card:hover .card-topbar { opacity: 1; }

    .card-header {
      padding: 16px 18px 12px;
      background: var(--bg2);
    }

    .card-meta {
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .card-badges { display: flex; align-items: center; gap: 7px; }

    .lang-badge {
      display: flex; align-items: center; gap: 5px;
      border-radius: 5px; padding: 3px 9px;
      border: 1px solid;
      font-family: var(--font-mono);
      font-size: 12px; font-weight: 700; letter-spacing: 0.03em;
    }
    .lang-dot {
      width: 7px; height: 7px; border-radius: 50%;
      display: inline-block;
    }
    .type-badge {
      background: var(--border); color: var(--muted);
      font-size: 12px; font-family: var(--font-body); font-weight: 600;
      padding: 3px 9px; border-radius: 5px; border: 1px solid var(--border2);
    }

    .status-badge {
      font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 5px;
      font-family: var(--font-body);
      letter-spacing: 0.02em;
      border: 1px solid;
    }

    .card-title {
      margin-top: 14px;
      font-family: var(--font-body);
      font-size: 16px; font-weight: 700;
      line-height: 1.35; letter-spacing: -0.01em;
      color: var(--text);
    }
    .card-tagline {
      margin-top: 5px; color: var(--text2);
      font-size: 13px; line-height: 1.55; font-weight: 400;
    }

    /* CODE PREVIEW */
    .code-wrap {
      margin: 0 16px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .code-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 12px;
      background: var(--bg4);
      border-bottom: 1px solid var(--border);
    }
    .traffic-lights { display: flex; gap: 5px; }
    .tl {
      width: 9px; height: 9px; border-radius: 50%;
    }
    .code-filename {
      color: var(--muted); font-size: 12px;
      font-family: var(--font-mono);
    }
    .preview-btn {
      background: transparent; cursor: pointer;
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 4px;
      letter-spacing: 0.04em; transition: all 0.2s;
    }

    .code-body {
      padding: 10px 0;
      max-height: 100px;
      overflow: hidden;
      position: relative;
      transition: max-height 0.35s ease;
    }
    .code-body.expanded { max-height: 200px; overflow-y: auto; }
    .code-line {
      display: flex; align-items: baseline;
      line-height: 1.75;
    }
    .line-num {
      color: #374151; font-size: 12px; width: 34px;
      text-align: right; padding-right: 14px;
      font-family: var(--font-mono);
      user-select: none; flex-shrink: 0;
    }
    .line-code {
      font-size: 12px;
      font-family: var(--font-mono);
      color: #CBD5E1;
      white-space: pre;
    }
    .line-code.accent { }
    .line-code.dim { color: #94A3B8; }

    .code-fade {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 50px;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .code-stats {
      display: flex; gap: 14px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: #080C14;
    }
    .stat { display: flex; gap: 4px; align-items: baseline; }
    .stat-val {
      font-size: 13px; font-weight: 700;
      font-family: var(--font-mono);
    }
    .stat-label { font-size: 12px; color: var(--muted2); font-family: var(--font-body); }

    /* TAGS */
    .tags {
      display: flex; flex-wrap: wrap; gap: 5px;
      padding: 12px 16px 8px;
    }
    .tag {
      background: var(--border); color: var(--muted);
      font-size: 12px; padding: 3px 9px;
      border-radius: 4px; border: 1px solid var(--border2);
      font-family: var(--font-body); font-weight: 500;
    }

    /* FOOTER */
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 16px;
    }
    .rating-block { display: flex; flex-direction: column; gap: 3px; }
    .stars { color: var(--amber); font-size: 14px; letter-spacing: -1px; }
    .rating-val { color: var(--text); font-size: 14px; font-weight: 700; margin-left: 4px; }
    .review-count { color: var(--muted); font-size: 12px; font-family: var(--font-body); }

    .price-block { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .price-row { display: flex; align-items: center; gap: 7px; }
    .discount-badge {
      font-size: 12px; padding: 2px 7px; border-radius: 4px;
      font-family: var(--font-body); font-weight: 700;
      background: rgba(124,58,237,0.12);
      color: #A78BFA;
      border: 1px solid rgba(124,58,237,0.25);
    }
    .original-price {
      color: var(--muted2); font-size: 13px;
      text-decoration: line-through; font-family: var(--font-body);
    }
    .price {
      color: var(--text); font-size: 19px; font-weight: 800;
      font-family: var(--font-body); letter-spacing: -0.02em;
    }
    .price-currency { font-size: 12px; color: var(--muted); font-weight: 500; }

    .buy-btn {
      border-radius: 7px; padding: 9px 20px;
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.25s ease;
      border: 1px solid;
    }

    /* ── FOOTER ── */
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      color: var(--muted2);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      nav { padding: 0 16px; }
      .nav-links { display: none; }
      .card { width: 100%; max-width: 360px; }
      .grid { padding: 0 16px 60px; }
    }
  </style>
</head>

      },
      {
        id: 3, language: "VBA", type: "Manual", level: "Principiante",

        tagline: "De principiante a automatizador profesional en 12 horas",
        price: 199, originalPrice: 299,
        rating: 4.7, reviews: 203, sales: 1203,
        lines: null, files: 1,
        tags: ["VBA", "Excel", "PDF", "148 páginas"],
        badge: "Top Rated", badgeColor: "#00C8F0",
        gradient: ["#00C8F0", "#FF2D78"],
        icon: "📘",
        filename: "README.md",
        code: [
          "# Manual VBA Desde Cero",
          "## Capítulo 1: Introducción",
          "",
          "VBA (Visual Basic for Applications)",
          "es el lenguaje de automatización",
          "integrado en Microsoft Office.",
          "Aprenderás a crear macros desde",
          "cero con ejemplos prácticos.",
        ]
      },
      {
        id: 4, language: "JavaScript", type: "Script", level: "Intermedio",
        title: "Google Sheets Automator",
        tagline: "Automatiza reportes en Google Sheets con Apps Script",
        price: 299, originalPrice: 399,
        rating: 4.6, reviews: 67, sales: 394,
        lines: 650, files: 2,
        tags: ["JavaScript", "Apps Script", "Google Sheets", "Reportes"],
        badge: null, badgeColor: null,
        gradient: ["#FCD34D", "#D97706"],
        icon: "📊",
        filename: "main.js",
        code: [
          "function generateReport() {",
          "  const ss = SpreadsheetApp",
          "    .getActiveSpreadsheet();",
          "  const sheet = ss.getSheetByName",
          "    ('Data');",
          "  const data = sheet.getDataRange()",
          "    .getValues();",
          "  processAndExport(data);",
        ]
      }
    ];

    const LANG_THEMES = {
      VBA:        { bg: "#1C1040", accent: "#00C8F0", dot: "#00A8CC" },
      Python:     { bg: "#1A0D35", accent: "#FF2D78", dot: "#CC1F5C" },
      JavaScript: { bg: "#1A1000", accent: "#FCD34D", dot: "#F59E0B" },
      SQL:        { bg: "#0D1535", accent: "#A78BFA", dot: "#7C3AED" },
    };

    // ── BUILD CARD HTML ─────────────────────────────────────────────
    function buildCard(p) {
      const t = LANG_THEMES[p.language] || LANG_THEMES.VBA;
      const discount = p.originalPrice
        ? Math.round((1 - p.price / p.originalPrice) * 100) : null;

      const codeLines = p.code.map((line, i) => `
        <div class="code-line">
          <span class="line-num">${i+1}</span>
          <span class="line-code ${i===0 ? 'accent' : i%3===0 ? 'dim' : ''}"
                style="${i===0 ? 'color:'+t.accent : ''}">${escHtml(line) || '&nbsp;'}</span>
        </div>`).join('');

      const statsHtml = p.lines ? `
        <div class="code-stats">
          <div class="stat"><span class="stat-val" style="color:${t.accent}">${p.lines.toLocaleString()}</span><span class="stat-label">líneas</span></div>
          <div class="stat"><span class="stat-val" style="color:${t.accent}">${p.files}</span><span class="stat-label">archivos</span></div>
          <div class="stat"><span class="stat-val" style="color:${t.accent}">${p.level}</span></div>
        </div>` : '';

      const badgeHtml = p.badge ? `
        <span class="status-badge"
          style="color:${p.badgeColor};background:${p.badgeColor}18;border-color:${p.badgeColor}40">
          ${p.badge}
        </span>` : '';

      const discountHtml = discount ? `<span class="discount-badge">-${discount}%</span>` : '';
      const origHtml = p.originalPrice
        ? `<span class="original-price">$${p.originalPrice}</span>` : '';

      const tagsHtml = p.tags.map(tag =>
        `<span class="tag">${tag}</span>`).join('');

      return `
      <div class="card" data-lang="${p.language}" data-type="${p.type}" id="card-${p.id}">
        <div class="card-topbar"
             style="background:linear-gradient(90deg,${p.gradient[0]},${p.gradient[1]})"></div>

        <div class="card-header">
          <div class="card-meta">
            <div class="card-badges">
              <span style="font-size:19px;line-height:1">${p.icon}</span>
              <span class="lang-badge"
                style="background:${t.bg};border-color:${t.accent}40;color:${t.accent}">
                <span class="lang-dot" style="background:${t.dot};box-shadow:0 0 6px ${t.dot}"></span>
                ${p.language}
              </span>
              <span class="type-badge">${p.type}</span>
            </div>
            ${badgeHtml}
          </div>
          <div class="card-title">${p.title}</div>
          <div class="card-tagline">${p.tagline}</div>
        </div>

        <div class="code-wrap">
          <div class="code-header">
            <div class="traffic-lights">
              <span class="tl" style="background:#FF5F57"></span>
              <span class="tl" style="background:#FEBC2E"></span>
              <span class="tl" style="background:#28C840"></span>
            </div>
            <span class="code-filename">${p.filename}</span>
            <button class="preview-btn"
              style="border:1px solid ${t.accent}40;color:${t.accent}"
              onclick="togglePreview(${p.id}, this, '${t.accent}')">▼ PREVIEW</button>
          </div>
          <div class="code-body" id="code-body-${p.id}">
            ${codeLines}
            <div class="code-fade" id="code-fade-${p.id}"
                 style="background:linear-gradient(transparent,#0D1117)"></div>
          </div>
          ${statsHtml}
        </div>

        <div class="tags">${tagsHtml}</div>

        <div class="card-footer">
          <div class="rating-block">
            <div>
              <span class="stars">★★★★★</span>
              <span class="rating-val">${p.rating}</span>
            </div>
            <div class="review-count">${p.reviews} reviews · ${p.sales.toLocaleString()} ventas</div>
          </div>
          <div class="price-block">
            <div class="price-row">
              ${discountHtml}
              ${origHtml}
              <span class="price">$${p.price} <span class="price-currency">MXN</span></span>
            </div>
            <button class="buy-btn"
              style="border-color:${t.accent}50;color:${t.accent};background:transparent"
              onmouseover="this.style.background='linear-gradient(135deg,${p.gradient[0]},${p.gradient[1]})';this.style.color='#0A0E1A'"
              onmouseout="this.style.background='transparent';this.style.color='${t.accent}'">
              COMPRAR →
            </button>
          </div>
        </div>
      </div>`;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── PREVIEW TOGGLE ──────────────────────────────────────────────
    function togglePreview(id, btn, accent) {
      const body = document.getElementById('code-body-' + id);
      const fade = document.getElementById('code-fade-' + id);
      const isOpen = body.classList.toggle('expanded');
      btn.textContent = isOpen ? '▲ CERRAR' : '▼ PREVIEW';
      fade.style.opacity = isOpen ? '0' : '1';
    }

    // ── HOVER GLOW ──────────────────────────────────────────────────
    function addHoverEffects() {
      document.querySelectorAll('.card').forEach(card => {
        const lang = card.dataset.lang;
        const t = LANG_THEMES[lang] || LANG_THEMES.VBA;
        card.addEventListener('mouseenter', () => {
          card.style.borderColor = t.accent + '60';
          card.style.boxShadow = `0 20px 60px rgba(0,0,0,.6), 0 0 0 1px ${t.accent}25, inset 0 1px 0 ${t.accent}15`;
        });
        card.addEventListener('mouseleave', () => {
          card.style.borderColor = '';
          card.style.boxShadow = '';
        });
      });
    }

    // ── FILTER ──────────────────────────────────────────────────────
    function renderGrid(filter) {
      const grid = document.getElementById('grid');
      const filtered = filter === 'todos' ? PRODUCTS
        : PRODUCTS.filter(p =>
            p.language === filter ||
            (filter === 'Manual' && p.type === 'Manual'));
      grid.innerHTML = filtered.map(buildCard).join('');
      addHoverEffects();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid(btn.dataset.filter);
      });
    });

    // ── INIT ────────────────────────────────────────────────────────
    renderGrid('todos');
  </script>
</body>
</html>
